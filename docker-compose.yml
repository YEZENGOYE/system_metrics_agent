services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "${API_PORT:-8000}:8000"
    networks:
      - metrics-net
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    environment:
      METRICS_ENDPOINT: http://api:8000/metrics
      COLLECTION_INTERVAL: ${COLLECTION_INTERVAL:-5}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-5}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - metrics-net
    restart: unless-stopped

networks:
  metrics-net:
    driver: bridge
